- route:
    id: agui-ui-test
    from:
      id: fromAguiUiTest
      uri: undertow
      parameters:
        httpURI: http://0.0.0.0:{{agent.runtime.test-port:18081}}/agui/ui?httpMethodRestrict=GET
      steps:
        - setHeader:
            id: setHeaderUiContentType
            name: Content-Type
            constant: text/html; charset=UTF-8
        - setHeader:
            id: setHeaderUiCacheControl
            name: Cache-Control
            constant: no-store, no-cache, must-revalidate, max-age=0
        - setHeader:
            id: setHeaderUiPragma
            name: Pragma
            constant: no-cache
        - setHeader:
            id: setHeaderUiExpires
            name: Expires
            constant: "0"
        - setHeader:
            id: setHeaderUiResourcePath
            name: AgUiStaticResourcePath
            constant: index.html
        - process:
            id: processUiIndexResource
            ref: agUiStaticResourceProcessor

- route:
    id: agui-ui-static-test
    from:
      id: fromAguiUiStaticTest
      uri: undertow
      parameters:
        httpURI: http://0.0.0.0:{{agent.runtime.test-port:18081}}/agui/ui/{assetPath}?httpMethodRestrict=GET
      steps:
        - setHeader:
            id: setHeaderAguiUiStaticResourcePath
            name: AgUiStaticResourcePath
            simple: ${header.assetPath}
        - process:
            id: processAguiUiStaticResource
            ref: agUiStaticResourceProcessor

- route:
    id: agui-ui-static-nested-test
    from:
      id: fromAguiUiStaticNestedTest
      uri: undertow
      parameters:
        httpURI: http://0.0.0.0:{{agent.runtime.test-port:18081}}/agui/ui/{assetDirectory}/{assetPath}?httpMethodRestrict=GET
      steps:
        - setHeader:
            id: setHeaderAguiUiNestedStaticResourcePath
            name: AgUiStaticResourcePath
            simple: ${header.assetDirectory}/${header.assetPath}
        - process:
            id: processAguiUiNestedStaticResource
            ref: agUiStaticResourceProcessor
